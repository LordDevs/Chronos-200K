<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHRONOS // Ship AI — Chronos-200K</title>
  <!-- Local stacks only — Google Fonts were blocking first paint when offline/slow -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-frame" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="bridge-header">
    <p class="brand">CHRONOS-200K</p>
    <p class="tagline">Deep-time colonial computer · year 200.000</p>
  </header>

  <main class="bridge">
    <section class="panel chat-panel" aria-label="CHRONOS chat">
      <div class="panel-title">
        <span>CHRONOS // Ship AI</span>
        <span class="status-dot" id="linkStatus" title="link">●</span>
      </div>
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <div class="quick-replies" id="quickReplies">
        <button type="button" data-cmd="ANALYZE PLANET kepler-442 b">Analisar exoplaneta</button>
        <button type="button" data-cmd="ANALYZE OCEAN PLANET">Ocean world</button>
        <button type="button" data-cmd="ACTIVATE ASTARTES KIT">Astartes Kit</button>
        <button type="button" data-cmd="PREDICT EVOLUTION 200K">Evolução 200K</button>
        <button type="button" data-cmd="SHIP STATUS">Status da nave</button>
      </div>
      <form id="chatForm" class="chat-input-row">
        <input type="text" id="chatInput" autocomplete="off"
               placeholder="Comando tático — ANALYZE PLANET / EVOLVE / STATUS">
        <button type="submit" id="sendBtn">TX</button>
      </form>
    </section>

    <section class="panel data-panel" aria-label="Exoplanet telemetry">
      <div class="panel-title">TELEMETRY // Exoplanets</div>
      <div id="planetCards" class="planet-cards"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
