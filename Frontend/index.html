<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHRONOS // Ship AI — Chronos-200K</title>
  <!-- Local stacks only — Google Fonts were blocking first paint when offline/slow -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-frame" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="visor-overlay" id="visorOverlay" aria-hidden="true"></div>

  <header class="bridge-header">
    <p class="brand">CHRONOS-200K</p>
    <p class="tagline">Deep-time colonial computer · year 200.000</p>
  </header>

  <main class="bridge">
    <section class="panel chat-panel" aria-label="CHRONOS chat">
      <div class="panel-title">
        <span>CHRONOS // Ship AI</span>
        <span class="status-dot" id="linkStatus" title="link">●</span>
      </div>
      <div class="voice-bar" id="voiceBar" aria-label="Sub-vocal command interface">
        <button type="button" id="micBtn" class="voice-btn" title="Comando de voz" aria-pressed="false">🎙 MIC</button>
        <button type="button" id="ttsBtn" class="voice-btn" title="Voz CHRONOS ligada" aria-pressed="true">🔊 TTS</button>
        <button type="button" id="langBtn" class="voice-btn lang-btn" title="Alternar idioma de voz PT/EN" aria-pressed="false">PT</button>
        <span class="voice-status" id="voiceStatus">VOZ // standby</span>
      </div>
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <div class="quick-replies" id="quickReplies">
        <button type="button" data-cmd="ANALYZE PLANET kepler-442 b">Analisar exoplaneta</button>
        <button type="button" data-cmd="ANALYZE OCEAN PLANET">Ocean world</button>
        <button type="button" data-cmd="ACTIVATE APEX PROTOCOL">Apex Protocol</button>
        <button type="button" data-cmd="PREDICT EVOLUTION 200K">Evolução 200K</button>
        <button type="button" data-cmd="LEARNING MODE LIST">Arquivo colonial</button>
        <button type="button" data-cmd="SHIP STATUS">Status da nave</button>
      </div>
      <form id="chatForm" class="chat-input-row">
        <input type="text" id="chatInput" autocomplete="off"
               placeholder="Comando tático — ANALYZE PLANET / EVOLVE / STATUS">
        <button type="submit" id="sendBtn">TX</button>
      </form>
    </section>

    <section class="panel data-panel" aria-label="Exoplanet telemetry">
      <div class="panel-title">TELEMETRY // Exoplanets</div>
      <div id="planetCards" class="planet-cards"></div>
    </section>

    <section class="panel colony-panel" aria-label="Colony archive">
      <div class="panel-title">COLONY ARCHIVE // Learning Mode v2</div>
      <form id="colonyForm" class="colony-form">
        <input type="text" id="colonyName" placeholder="Nome (ex: mars-colony)" required>
        <div class="colony-fields">
          <label>g <input type="number" id="colonyGravity" step="0.01" min="0.1" max="5" value="1.0"></label>
          <label>água % <input type="number" id="colonyWater" step="1" min="0" max="100" value="50"></label>
          <label>temp °C <input type="number" id="colonyTemp" step="1" value="15"></label>
          <label>gerações <input type="number" id="colonyGens" step="100" min="100" value="1000"></label>
        </div>
        <select id="colonyAtmo" aria-label="Atmosphere">
          <option value="N2-O2">N2-O2</option>
          <option value="CO2-rich">CO2-rich</option>
          <option value="CH4-rich">CH4-rich</option>
          <option value="thin">thin</option>
        </select>
        <button type="submit" class="colony-save-btn">Guardar perfil</button>
      </form>
      <div id="colonyCards" class="colony-cards"></div>
    </section>
  </main>

  <script src="voice.js"></script>
  <script src="script.js"></script>
</body>
</html>
